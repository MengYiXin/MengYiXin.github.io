<!DOCTYPE html><html lang="zh-CN">
<head>
<!-- 3pages-1790160627-6956 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Ascend Notes</title>
<meta name="description" content="Ascend Notes 登录">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 48px 40px; max-width: 420px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  h1 { color: #fff; font-size: 24px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
  .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 18px; }
  label { display: block; color: rgba(255,255,255,0.8); font-size: 13px; margin-bottom: 6px; font-weight: 500; }
  input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 14px; transition: all 0.2s; outline: none; }
  input:focus { background: rgba(255,255,255,0.12); border-color: #06c;#4f9eff; }
  input::placeholder { color: rgba(255,255,255,0.3); }
  button { width: 100%; padding: 13px; background: linear-gradient(135deg, #4f9eff 0%, #06c 100%); border: none; border-radius: 6px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hint { color: rgba(255,255,255,0.4); font-size: 11px; margin-top: 24px; text-align: center; }
  .brand { text-align: center; margin-bottom: 24px; }
  .brand-icon { display: inline-block; width: 48px; height: 48px; background: linear-gradient(135deg, #4f9eff, #06c); border-radius: 10px; color: #fff; font-weight: bold; font-size: 20px; line-height: 48px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="brand-icon">A</div>
  </div>
  <h1>Ascend Notes</h1>
  <p class="subtitle">昇腾实测档案 · 请登录</p>
  <form id="login-form">
    <div class="field">
      <label for="user">账号</label>
      <input id="user" type="text" autocomplete="username" required placeholder="大写 M">
    </div>
    <div class="field">
      <label for="pass">密码</label>
      <input id="pass" type="password" autocomplete="current-password" required placeholder="请输入密码">
    </div>
    <button type="submit">登录</button>
    <div id="error" class="error"></div>
  </form>
  <p class="hint">本页数据仅供内部参考 · 不对外公开</p>
</div>
<script>
const EXPECTED_USER = "M";
const EXPECTED_PASS = "Dos70001";
const KEY = "ascend-notes-auth";
const NEXT = new URLSearchParams(location.search).get("next") || "/notes/";

document.getElementById("login-form").addEventListener("submit", e => {
  e.preventDefault();
  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value;
  const err = document.getElementById("error");
  if (u === EXPECTED_USER && p === EXPECTED_PASS) {
    localStorage.setItem(KEY, JSON.stringify({u, ts: Date.now()}));
    location.replace(NEXT);
  } else {
    err.textContent = "账号或密码错误";
    setTimeout(() => err.textContent = "", 3000);
  }
});

// 已登录直接跳过
try {
  const auth = JSON.parse(localStorage.getItem(KEY) || "null");
  if (auth && auth.u === EXPECTED_USER) location.replace(NEXT);
} catch(e) {}
</script>
</body>
</html>
