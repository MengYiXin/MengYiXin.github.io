      <text x="140" y="132" fill="#22d3ee" font-size="9" text-anchor="middle">2026.2.3-1 → 2026.5.6</text>

      <!-- Bug 1 -->
      <rect x="30" y="150" width="210" height="44" rx="6" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1"/>
      <text x="40" y="166" fill="#fb7185" font-size="8" font-weight="600">Bug #1 · npm 权限报错</text>
      <text x="40" y="178" fill="#94a3b8" font-size="7">preinstall 脚本调用 node 失败</text>
      <text x="40" y="189" fill="#34d399" font-size="7">fix: npm install -g --ignore-scripts</text>
      <line x1="135" y1="138" x2="135" y2="150" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,2"/>

      <!-- Bug 2 -->
      <rect x="30" y="202" width="210" height="44" rx="6" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1"/>
      <text x="40" y="218" fill="#fb7185" font-size="8" font-weight="600">Bug #2 · 404 model_not_found</text>
      <text x="40" y="230" fill="#94a3b8" font-size="7">openai-completions 不支持 M2.7</text>
      <text x="40" y="241" fill="#34d399" font-size="7">fix: api → anthropic-messages</text>
      <line x1="135" y1="138" x2="135" y2="202" stroke="#fb7185" stroke-width="0.8" stroke-dasharray="3,2"/>

