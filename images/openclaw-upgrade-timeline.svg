      <text x="710" y="244" fill="#94a3b8" font-size="7">auxiliary.vision base_url 不一致</text>
      <text x="710" y="255" fill="#34d399" font-size="7">fix: Vision base_url → /v1, model → MiniMax-M2</text>
      <line x1="805" y1="138" x2="805" y2="216" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="3,2"/>

