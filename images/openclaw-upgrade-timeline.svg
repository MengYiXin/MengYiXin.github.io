      <!-- ===== Success Box ===== -->
      <rect x="700" y="330" width="260" height="56" rx="8" fill="rgba(52, 211, 153, 0.15)" stroke="#34d399" stroke-width="1.5"/>
      <text x="830" y="350" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">✅ All 9 Bugs Patched</text>
      <text x="830" y="366" fill="#94a3b8" font-size="8" text-anchor="middle">baseUrl: api.minimaxi.com/v1</text>
      <text x="830" y="380" fill="#94a3b8" font-size="8" text-anchor="middle">飞书 ✅ Hermes ✅ Claude Code ✅</text>
      <line x1="805" y1="312" x2="805" y2="330" stroke="#34d399" stroke-width="1"/>

      <!-- ===== Summary Legend ===== -->
      <rect x="30" y="450" width="940" height="160" rx="10" fill="rgba(15, 23, 42, 0.3)" stroke="#1e293b" stroke-width="1"/>
      <text x="50" y="468" fill="white" font-size="10" font-weight="700">Summary · Upgrade Routine for Windows</text>

      <text x="50" y="488" fill="#fb7185" font-size="8" font-weight="600">Round 1 (2026.5.7):</text>
      <text x="170" y="488" fill="#94a3b8" font-size="8">npm -g --ignore-scripts → anthropic-messages → 删 apiKeyEnv → pairing approve → Stop-Process</text>

      <text x="50" y="506" fill="#fbbf24" font-size="8" font-weight="600">Round 2 (2026.5.20):</text>
      <text x="170" y="506" fill="#94a3b8" font-size="8">npm -g --ignore-scripts → 手动改 gateway.cmd OPENCLAW_SERVICE_VERSION → schtasks /run</text>

      <text x="50" y="524" fill="#a78bfa" font-size="8" font-weight="600">Round 3 (2026.5.22):</text>
      <text x="170" y="524" fill="#94a3b8" font-size="8">npm -g --ignore-scripts → base_url /anthropic → /v1 → vision base_url 同步改为 /v1</text>

      <!-- Key lesson box -->
      <rect x="50" y="538" width="900" height="62" rx="6" fill="rgba(251, 191, 36, 0.08)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="70" y="556" fill="#fbbf24" font-size="9" font-weight="700">⚠ Windows 升级关键检查项</text>
      <text x="70" y="572" fill="#94a3b8" font-size="8">① gateway.cmd 里的 OPENCLAW_SERVICE_VERSION 是否更新到新版本号</text>
      <text x="70" y="586" fill="#94a3b8" font-size="8">② openclaw.json 的 baseUrl 是否仍为 /v1（不是 /anthropic）</text>
      <text x="70" y="596" fill="#fbbf24" font-size="7">③ auxiliary_client vision 的 base_url 和 model 是否与主 provider 一致</text>
    </svg>