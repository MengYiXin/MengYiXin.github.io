      <circle cx="810" cy="80" r="14" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
      <text x="810" y="84" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle">3</text>
      <text x="810" y="58" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle">Round 3</text>
      <text x="810" y="108" fill="#94a3b8" font-size="8" text-anchor="middle">2026.5.22</text>
      <rect x="760" y="118" width="100" height="20" rx="4" fill="rgba(167, 139, 250, 0.15)" stroke="#a78bfa" stroke-width="1"/>
      <text x="810" y="132" fill="#a78bfa" font-size="9" text-anchor="middle">2026.5.20 → 2026.5.22</text>

