name: Deploy Hexo Blog

on:
  push:
    branches:
      - source

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
          sparse-checkout: |
            source
            themes
            _config.yml
            scaffolds
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Git
        run: |
          git config --global user.name "MengYiXin"
          git config --global user.email "MengYiXin@users.noreply.github.com"

      - name: Configure SSH for deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "Host github.com" >> ~/.ssh/config
          echo "  HostName github.com" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install dependencies
        run: npm ci

      - name: Debug config
        run: |
          echo "=== Site _config.yml first_screen ==="
          grep -A5 "first_screen" _config.yml || echo "NOT FOUND in site config"
          echo "=== Theme package _config.yml first_screen ==="
          grep -A5 "first_screen" node_modules/hexo-theme-keep/_config.yml || echo "NOT FOUND in theme config"
          echo "=== All theme_config keys ==="
          grep "^[a-z]" node_modules/hexo-theme-keep/_config.yml | head -20

      - name: Override theme config with site values
        run: |
          # hexo-theme-keep's default _config.yml has first_screen.enable: false
          # and first_screen.description: Keep writing and Keep loving.
          # Our _config.yml has theme_config.first_screen with the right values,
          # but Hexo's theme_config merge doesn't work reliably in all environments.
          # FIX: Directly patch the theme package's _config.yml
          python3 << 'EOF'
          import re
          theme_cfg = "node_modules/hexo-theme-keep/_config.yml"
          with open(theme_cfg, "r") as f:
            content = f.read()
          # Patch first_screen section - replace enable line and description line unconditionally
          content = re.sub(
            r'(first_screen:\n\s+enable:\s*)\w+',
            r'\g<1>true',
            content
          )
          content = re.sub(
            r'(first_screen:\n\s+description:\s*)[^\n]+',
            r'\g<1>不要熬夜哟！',
            content
          )
          with open(theme_cfg, "w") as f:
            f.write(content)
          print("Theme config patched successfully")
          # Verify
          import subprocess
          result = subprocess.run(
            ["grep", "-A2", "first_screen:", theme_cfg],
            capture_output=True, text=True
          )
          print("Result:", result.stdout.strip())
          EOF

      - name: Build
        run: npx hexo generate

      - name: Deploy
        run: |
          git clone git@github.com:MengYiXin/MengYiXin.github.io.git _deploy
          cp -r public/* _deploy/
          # 复制 CNAME（如果存在）
          if [ -f source/CNAME ]; then
            cp source/CNAME _deploy/CNAME
          fi
          cd _deploy
          git config user.name "MengYiXin"
          git config user.email "MengYiXin@users.noreply.github.com"
          git add .
          git commit -m "deploy: ${{ github.event.head_commit.message }} $(date)"
          git push
