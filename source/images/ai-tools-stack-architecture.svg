<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools Stack Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .card { background: rgba(15, 23, 42, 0.5); border-radius: 0.75rem; border: 1px solid #1e293b; padding: 1.25rem; }
    .card-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .card-dot { width: 8px; height: 8px; border-radius: 50%; }
    .card-dot.cyan { background: #22d3ee; } .card-dot.emerald { background: #34d399; }
    .card-dot.violet { background: #a78bfa; } .card-dot.amber { background: #fbbf24; }
    .card-dot.rose { background: #fb7185; } .card-dot.orange { background: #fb923c; }
    .card h3 { font-size: 0.875rem; font-weight: 600; }
    .card ul { list-style: none; color: #94a3b8; font-size: 0.75rem; }
    .card li { margin-bottom: 0.375rem; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row">
      <div class="pulse-dot"></div>
      <h1>AI Tools Stack — MiniMax Unified Architecture</h1>
    </div>
    <p class="subtitle">OpenClaw × Claude Code × Hermes Agent · Three Tools, One Model, Zero Messy Bills</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 1000 720">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c" />
        </marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />

      <!-- ===== MiniMax Cloud Boundary ===== -->
      <rect x="620" y="20" width="360" height="680" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
      <text x="634" y="38" fill="#fbbf24" font-size="10" font-weight="600">☁ MiniMax Cloud</text>
      <text x="634" y="52" fill="#78350f" font-size="8">api.minimaxi.com/v1</text>

      <!-- ===== MiniMax Provider (center of cloud) ===== -->
      <rect x="700" y="80" width="220" height="100" rx="10" fill="rgba(120, 53, 15, 0.5)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="810" y="106" fill="white" font-size="12" font-weight="700" text-anchor="middle">MiniMax-M2.7</text>
      <text x="810" y="124" fill="#fbbf24" font-size="9" text-anchor="middle">Anthropic-compatible API</text>
      <text x="810" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">context: 1M tokens · reasoning: on</text>
      <text x="810" y="155" fill="#94a3b8" font-size="8" text-anchor="middle">maxTokens: 16384</text>
      <text x="810" y="172" fill="#fbbf24" font-size="8" text-anchor="middle">⚡ unified billing</text>

      <!-- ===== OpenClaw Box ===== -->
      <rect x="30" y="80" width="200" height="220" rx="10" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="130" y="102" fill="white" font-size="11" font-weight="700" text-anchor="middle">OpenClaw Gateway</text>
      <text x="130" y="116" fill="#22d3ee" font-size="8" text-anchor="middle">v2026.5.22 · Windows</text>
      <!-- gateway sub-components -->
      <rect x="50" y="128" width="160" height="36" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#22d3ee" stroke-width="1"/>
      <text x="130" y="145" fill="#94a3b8" font-size="8" text-anchor="middle">Feishu Bot · 影子 🖤</text>
      <rect x="50" y="170" width="160" height="36" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#94a3b8" stroke-width="1"/>
      <text x="130" y="187" fill="#94a3b8" font-size="8" text-anchor="middle">WebSocket · :18789</text>
      <rect x="50" y="212" width="160" height="36" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#94a3b8" stroke-width="1"/>
      <text x="130" y="229" fill="#94a3b8" font-size="8" text-anchor="middle">Windows 计划任务自启</text>
      <rect x="50" y="254" width="160" height="36" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#94a3b8" stroke-width="1"/>
      <text x="130" y="271" fill="#94a3b8" font-size="8" text-anchor="middle">provider: minimax</text>

      <!-- ===== Claude Code Box ===== -->
      <rect x="30" y="330" width="200" height="130" rx="10" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1.5"/>
      <text x="130" y="352" fill="white" font-size="11" font-weight="700" text-anchor="middle">Claude Code</text>
      <text x="130" y="366" fill="#34d399" font-size="8" text-anchor="middle">Local CLI · IDE 集成</text>
      <!-- skills row -->
      <text x="50" y="384" fill="#fbbf24" font-size="8">6 Skills</text>
      <rect x="80" y="374" width="130" height="70" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="90" y="390" fill="#94a3b8" font-size="7">explore · debugger</text>
      <text x="90" y="402" fill="#94a3b8" font-size="7">code-review · test-engineer</text>
      <text x="90" y="414" fill="#94a3b8" font-size="7">code-simplifier</text>
      <text x="90" y="426" fill="#94a3b8" font-size="7">security-review</text>
      <text x="130" y="438" fill="#fbbf24" font-size="7" text-anchor="middle">按职责分工调用</text>

      <!-- ===== Hermes Agent Box ===== -->
      <rect x="30" y="490" width="200" height="130" rx="10" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="130" y="512" fill="white" font-size="11" font-weight="700" text-anchor="middle">Hermes Agent</text>
      <text x="130" y="526" fill="#a78bfa" font-size="8" text-anchor="middle">v0.14.0 · Windows</text>
      <rect x="50" y="538" width="160" height="30" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#a78bfa" stroke-width="1"/>
      <text x="130" y="555" fill="#94a3b8" font-size="8" text-anchor="middle">飞书消息入口 · Feishu Connected</text>
      <rect x="50" y="574" width="160" height="30" rx="5" fill="rgba(30, 41, 59, 0.6)" stroke="#a78bfa" stroke-width="1"/>
      <text x="130" y="591" fill="#94a3b8" font-size="8" text-anchor="middle">Cron 调度 · session backup</text>

      <!-- ===== ClawHub Skills (right side) ===== -->
      <rect x="640" y="220" width="320" height="220" rx="10" fill="rgba(251, 146, 60, 0.08)" stroke="#fb923c" stroke-width="1" stroke-dasharray="6,3"/>
      <text x="655" y="238" fill="#fb923c" font-size="9" font-weight="600">ClawHub Plugins</text>
      <text x="655" y="251" fill="#78350f" font-size="7">OpenClaw 8 核心插件</text>
      <!-- skill items -->
      <rect x="655" y="258" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="272" fill="#fb923c" font-size="7">agent-browser</text>
      <text x="780" y="272" fill="#94a3b8" font-size="7">网页自动化</text>
      <rect x="655" y="288" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="302" fill="#fb923c" font-size="7">bb-browser</text>
      <text x="780" y="302" fill="#94a3b8" font-size="7">浏览器辅助</text>
      <rect x="655" y="318" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="332" fill="#fb923c" font-size="7">opencli</text>
      <text x="780" y="332" fill="#94a3b8" font-size="7">命令行增强</text>
      <rect x="655" y="348" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="362" fill="#fb923c" font-size="7">skill-vetter</text>
      <text x="780" y="362" fill="#94a3b8" font-size="7">Skill 质量审核</text>
      <rect x="655" y="378" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="392" fill="#fb923c" font-size="7">self-improving-agent</text>
      <text x="820" y="392" fill="#94a3b8" font-size="7">自我反思优化</text>
      <rect x="655" y="408" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="422" fill="#fb923c" font-size="7">lossless-claw</text>
      <text x="780" y="422" fill="#94a3b8" font-size="7">无损页面抓取</text>
      <rect x="655" y="438" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="452" fill="#fb923c" font-size="7">control-center</text>
      <text x="780" y="452" fill="#94a3b8" font-size="7">Agent 调度中心</text>
      <rect x="655" y="468" width="290" height="26" rx="4" fill="rgba(30, 41, 59, 0.5)" stroke="#fb923c" stroke-width="0.8"/>
      <text x="665" y="482" fill="#fb923c" font-size="7">openclaw-backup</text>
      <text x="780" y="482" fill="#94a3b8" font-size="7">配置备份恢复</text>

      <!-- ===== Arrows: Clients → MiniMax ===== -->
      <!-- OpenClaw → MiniMax -->
      <line x1="230" y1="140" x2="698" y2="110" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="430" y="116" fill="#22d3ee" font-size="8">anthropic-messages</text>
      <!-- Claude Code → MiniMax -->
      <line x1="230" y1="390" x2="698" y2="160" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="420" y="200" fill="#34d399" font-size="8">ANTHROPIC_API_KEY</text>
      <!-- Hermes → MiniMax -->
      <line x1="230" y1="550" x2="698" y2="200" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
      <text x="390" y="290" fill="#a78bfa" font-size="8">v1/messages</text>

      <!-- ===== Feishu → OpenClaw ===== -->
      <line x1="30" y1="190" x2="0" y2="190" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrowhead)" transform="rotate(0)"/>
      <text x="10" y="180" fill="#94a3b8" font-size="7">飞书消息</text>

      <!-- ===== Legend ===== -->
      <text x="640" y="510" fill="white" font-size="9" font-weight="600">Legend</text>
      <rect x="640" y="522" width="14" height="9" rx="2" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="1"/>
      <text x="660" y="530" fill="#94a3b8" font-size="8">Frontend / OpenClaw</text>
      <rect x="640" y="536" width="14" height="9" rx="2" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1"/>
      <text x="660" y="544" fill="#94a3b8" font-size="8">Backend / Claude Code</text>
      <rect x="640" y="550" width="14" height="9" rx="2" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="1"/>
      <text x="660" y="558" fill="#94a3b8" font-size="8">Database / Hermes Agent</text>
      <rect x="640" y="564" width="14" height="9" rx="2" fill="rgba(120, 53, 15, 0.5)" stroke="#fbbf24" stroke-width="1"/>
      <text x="660" y="572" fill="#94a3b8" font-size="8">Cloud / MiniMax Provider</text>
      <rect x="640" y="578" width="14" height="9" rx="2" fill="rgba(251, 146, 60, 0.1)" stroke="#fb923c" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="660" y="586" fill="#94a3b8" font-size="8">Plugin / Skill 系统</text>
      <line x1="640" y1="596" x2="655" y2="596" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,5"/>
      <text x="660" y="599" fill="#94a3b8" font-size="8">ClawHub 安装路径</text>
    </svg>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-header">
        <div class="card-dot cyan"></div>
        <h3>OpenClaw · 飞书 AI 机器人</h3>
      </div>
      <ul>
        <li>• v2026.5.22，Windows 本地部署</li>
        <li>• provider: minimax · api: anthropic-messages</li>
        <li>• baseUrl: api.minimaxi.com/v1</li>
        <li>• 飞书配对，Windows 计划任务开机自启</li>
        <li>• ClawHub 8 核心插件扩展</li>
        <li>• 身份：影子 🖤 AI 助手</li>
      </ul>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-dot emerald"></div>
        <h3>Claude Code · 本地代码助手</h3>
      </div>
      <ul>
        <li>• ANTHROPIC_API_KEY 环境变量接入</li>
        <li>• MiniMax 代理为 Anthropic 端点</li>
        <li>• 6 个核心 Skill：按职责分工调用</li>
        <li>• explore 通读架构 · debugger 定位报错</li>
        <li>• code-review 查漏洞 · test-engineer 测用例</li>
        <li>• code-simplifier 删冗余 · security-review 扫风险</li>
      </ul>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-dot violet"></div>
        <h3>Hermes Agent · 主力 AI 助手</h3>
      </div>
      <ul>
        <li>• v0.14.0，Python + MiniMax-M2.7</li>
        <li>• 飞书消息入口，Feishu Connected</li>
        <li>• Cron 调度：日报提醒、状态监控</li>
        <li>• session backup 自动存档</li>
        <li>• IMA 知识库集成</li>
        <li>• 统一计费：三方共用同一 API Key</li>
      </ul>
    </div>
  </div>

  <p class="footer">AI Tools Stack · MiniMax-M2.7 · Three tools, one model, unified billing</p>
</div>
</body>
</html>
