<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="960" cy="540" rx="600" ry="400" fill="url(#glow)"/>
  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="300" cy="150" r="1" fill="white" opacity="0.6"/>
  <circle cx="500" cy="60" r="2" fill="white" opacity="0.9"/>
  <circle cx="750" cy="120" r="1" fill="white" opacity="0.5"/>
  <circle cx="1000" cy="90" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="1300" cy="50" r="2" fill="white" opacity="0.8"/>
  <circle cx="1600" cy="100" r="1" fill="white" opacity="0.6"/>
  <circle cx="1750" cy="70" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="200" cy="200" r="1" fill="white" opacity="0.4"/>
  <circle cx="600" cy="180" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1100" cy="160" r="1" fill="white" opacity="0.6"/>
  <circle cx="1500" cy="200" r="2" fill="white" opacity="0.4"/>
  <!-- Moon -->
  <circle cx="1600" cy="200" r="60" fill="#f5f5dc" opacity="0.9"/>
  <circle cx="1580" cy="190" r="55" fill="url(#bg)"/>
  <!-- Code symbol -->
  <text x="960" y="520" font-family="monospace" font-size="28" fill="#e94560" opacity="0.3" text-anchor="middle">&lt;/&gt;</text>
</svg>
