<script>
// 简易 auth guard
(function(){
  const KEY = "ascend-notes-auth";
  const EXPECTED_USER = "M";
  // 检查登录
  let auth = null;
  try { auth = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) {}
  if (!auth || auth.u !== EXPECTED_USER) {
    const here = location.pathname + location.search;
    const loginUrl = "/notes/login.html?next=" + encodeURIComponent(here.replace(/^\/notes\//, "/notes/"));
    location.replace(loginUrl);
  }
  // 添加退出按钮（右上角）
  window.addEventListener("DOMContentLoaded", () => {
    if (document.querySelector(".auth-logout-btn")) return;
    const btn = document.createElement("button");
    btn.className = "auth-logout-btn";
    btn.textContent = "退出";
    btn.title = "退出登录";
    btn.style.cssText = "position:fixed;bottom:20px;right:20px;z-index:9999;background:rgba(0,0,0,0.7);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:12px;";
    btn.addEventListener("click", () => {
      if (confirm("确定退出登录？")) {
        localStorage.removeItem(KEY);
        location.replace("/notes/login.html");
      }
    });
    document.body.appendChild(btn);
  });
})();
</script>

<script>
// pre 代码块加复制按钮
(function(){
  function attachCopyBtn(pre){
    if (pre.dataset.copyAttached) return;
    pre.dataset.copyAttached = "1";
    const code = pre.querySelector("code") || pre;
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.type = "button";
    btn.textContent = "复制";
    btn.addEventListener("click", async () => {
      const text = code.innerText.replace(/ /g, " ");
      try {
        await navigator.clipboard.writeText(text);
      } catch(e) {
        // fallback
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      btn.textContent = "已复制";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("copied"); }, 1400);
    });
    pre.appendChild(btn);
  }
  document.querySelectorAll("pre").forEach(attachCopyBtn);
  // 监听 DOM 变化（页面动态内容）
  new MutationObserver(muts => {
    for (const m of muts) m.addedNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      if (n.tagName === "PRE") attachCopyBtn(n);
      n.querySelectorAll && n.querySelectorAll("pre").forEach(attachCopyBtn);
    });
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
